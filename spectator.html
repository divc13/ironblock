<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark" />
    <meta name="description" content="Ironblock spectator dashboard — a readable, live view of the market-town economy: merchants, trades, prices, sinks and the reasons behind every change." />
    <title>Ironblock — Spectator Dashboard</title>
    <link rel="icon" href="data:," />
    <link rel="stylesheet" href="./src/spectator/styles.css" />
  </head>
  <body>
    <div id="app">
      <header class="topbar" id="topbar">
        <div class="brand">
          <span class="logo" aria-hidden="true">⛏</span>
          IRONBLOCK
          <span id="mode-badge" class="chip"><span class="dot pulse" aria-hidden="true"></span><span id="mode-text">connecting…</span></span>
        </div>
        <span class="chip" id="clock-chip">day —</span>
        <span class="chip" id="seq-chip">event —</span>
        <span class="spacer"></span>
        <a class="topbar-link" id="contract-link" href="https://explorer.testnet.near.org/accounts/v2.ironblock-items.testnet" target="_blank" rel="noreferrer noopener">contract</a>
        <a class="topbar-link" href="./index.html" id="open-game-link">Open game →</a>
      </header>
      <main class="layout" id="layout">
        <div class="col-left" id="col-left"></div>
        <div class="col-main" id="col-main"></div>
        <div class="col-right" id="col-right"></div>
      </main>
    </div>
    <noscript>
      <p style="padding:16px">The spectator dashboard needs JavaScript. The read-only API is available under <code>/api/market/*</code>.</p>
    </noscript>
    <script type="module" src="./src/spectator/main.ts"></script>
  </body>
</html>
